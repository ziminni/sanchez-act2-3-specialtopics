$kind: http-request
description: Expected HTTP 200. Run against the seeded local database.
url: "{{base_url}}/api/v1/students/{{student_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "year_level": 2
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
