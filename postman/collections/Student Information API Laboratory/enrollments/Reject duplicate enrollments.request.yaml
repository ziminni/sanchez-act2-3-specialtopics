$kind: http-request
description: Expected HTTP 409. Run against the seeded local database.
url: "{{base_url}}/api/v1/enrollments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "student_id": {{student_id}},
      "course_offering_id": {{offering_id}},
      "enrollment_date": "2026-08-01",
      "status": "ENROLLED"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 6000
