$kind: http-request
description: Expected HTTP 201. Run against the seeded local database.
url: "{{base_url}}/api/v1/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Demo User",
      "email": "demo{{run_id}}@example.com",
      "password": "{{password}}",
      "role": "STUDENT"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("user_id", pm.response.json().data.id);
    language: text/javascript
order: 1000
