$kind: http-request
description: Expected HTTP 201. Run against the seeded local database.
url: "{{base_url}}/api/v1/grades"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "enrollment_id": {{enrollment_id}},
      "midterm_grade": 85,
      "final_grade": 90,
      "remarks": "Passed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("grade_id", pm.response.json().data.id);
    language: text/javascript
order: 1000
