$kind: http-request
description: Expected HTTP 201. Run against the seeded local database.
url: "{{base_url}}/api/v1/academic-terms"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "academic_year": "2027-2028",
      "semester": "FIRST",
      "start_date": "2027-08-01",
      "end_date": "2027-12-20"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.collectionVariables.set("temporary_term_id", pm.response.json().data.id);
    language: text/javascript
order: 1000
