$kind: http-request
description: Expected HTTP 401. Run against the seeded local database.
url: "{{base_url}}/api/v1/students"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
