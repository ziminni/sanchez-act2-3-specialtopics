$kind: http-request
description: Expected HTTP 422. Run against the seeded local database.
url: "{{base_url}}/api/v1/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "student_number": "S{{run_id}}",
      "first_name": "Maria",
      "last_name": "Reyes",
      "email": "invalid",
      "program_id": {{program_id}},
      "year_level": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 8000
