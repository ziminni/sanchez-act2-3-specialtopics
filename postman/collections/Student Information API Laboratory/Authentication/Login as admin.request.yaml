$kind: http-request
description: Expected HTTP 200. Run against the seeded local database.
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@example.com",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.collectionVariables.set("token", pm.response.json().data.access_token);
    language: text/javascript
order: 1000
